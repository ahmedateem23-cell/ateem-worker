name = "ateem-proxy"
main = "worker.js"
compatibility_date = "2026-08-01"

# ⚠️ الاسم فوق ده لازم يطابق بالظبط اسم الـ Worker الموجود بالفعل في
# لوحة Cloudflare (اللي شكله عندك على الأغلب "ateem-proxy" بناءً على
# رابط ateem-proxy.ahmedatim23.workers.dev). لو الاسم في اللوحة مختلف،
# غيّر القيمة فوق تطابقه بالظبط — وإلا Cloudflare هينشئ Worker جديد
# منفصل بدل ما يحدّث اللي شغال بالفعل.

# ── ربط الـ KV Namespace (ATEEM_KV) ──
# لازم تجيب الـ Namespace ID الحقيقي من لوحة Cloudflare:
# Workers & Pages → KV → دوس على ATEEM_KV → انسخ "Namespace ID"
# وحطه مكان <YOUR_KV_NAMESPACE_ID> تحت، وشيل علامة الـ # من أول السطرين.
#
# [[kv_namespaces]]
# binding = "ATEEM_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"

# ملحوظة مهمة عن الأسرار (Secrets):
# ODOO_API_KEY / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID / GROQ_API_KEY /
# FIREBASE_SERVICE_ACCOUNT_KEY / ORDER_CONFIRM_SECRET
# ده كله يفضل متحط في الكود أو في الملف ده أبدًا. هي متسجلة بالفعل على
# الـ Worker من لوحة Cloudflare (Settings → Variables and Secrets)،
# وبتفضل شغالة زي ما هي حتى بعد ما تربط الـ Git — مش محتاج تعمل فيها
# حاجة تاني إلا لو غيّرت قيمة سر معين.

